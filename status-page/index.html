<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Covenant — status</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14171c;
    --border: #262b33;
    --text: #e6e9ee;
    --muted: #8b93a1;
    --allow: #3ecf8e;
    --deny: #e5484d;
    --accent: #6ea8fe;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    padding: 24px 16px 64px;
  }
  main { max-width: 920px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 12px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  input {
    background: #0e1013;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 10px;
    font: inherit;
    flex: 1;
    min-width: 220px;
  }
  button {
    background: var(--accent);
    color: #0b0d10;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .stat .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .stat .value { font-size: 18px; margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.allow { background: rgba(62,207,142,.15); color: var(--allow); }
  .badge.deny { background: rgba(229,72,77,.15); color: var(--deny); }
  .addr { color: var(--accent); }
  .err { color: var(--deny); font-size: 12px; margin-top: 8px; }
  .empty { color: var(--muted); font-style: italic; }
  a { color: var(--accent); }
  .plain-row td { border-bottom: 1px solid var(--border); padding: 2px 8px 8px; white-space: normal; color: var(--muted); font-style: italic; }
  .boss { font-weight: 600; }
  .boss-flagship { color: var(--deny); text-shadow: 0 0 8px rgba(229,72,77,.35); }
  .twin-row td { font-style: normal; color: var(--allow); background: rgba(62,207,142,.06); }
</style>
</head>
<body>
<main>
  <h1>Covenant — mandate status</h1>
  <p class="sub">Read-only view, straight off chain. No backend - every value here is an eth_call or an event log read live from the RPC endpoint below.</p>

  <div class="panel">
    <h2>Connection</h2>
    <div class="row">
      <input id="rpc" placeholder="RPC URL (e.g. http://127.0.0.1:8545 or https://bsc-dataseed.binance.org)" />
      <input id="contract" placeholder="Covenant contract address (0x...)" />
    </div>
    <div class="row">
      <input id="fromBlock" placeholder="fromBlock (optional - e.g. Covenant's deployment block; default is the last 2000 blocks)" />
      <button id="connect">Load</button>
    </div>
    <div id="error" class="err"></div>
  </div>

  <div class="panel">
    <h2>Mandate</h2>
    <div id="mandate" class="grid empty">Not loaded yet.</div>
  </div>

  <div class="panel">
    <h2>Decisions (most recent first)</h2>
    <div id="attestations" class="empty">Not loaded yet.</div>
  </div>
</main>

<script type="module">
import { ethers } from "https://cdn.jsdelivr.net/npm/ethers@6/+esm";
import { ABI, fetchDecisionEvents, joinDecisions, resolveFromBlock, describeDecision, bossFor, guardedVsUnguarded } from "./lib.mjs";

const MAX_DECISIONS = 50;

const $ = (id) => document.getElementById(id);

function readUrlParams() {
  const params = new URLSearchParams(location.search);
  return {
    rpc: params.get("rpc") ?? "",
    contract: params.get("contract") ?? "",
    fromBlock: params.get("fromBlock") ?? "",
  };
}

function setError(message) {
  $("error").textContent = message ?? "";
}

function fmtAddr(addr) {
  return addr.slice(0, 6) + "…" + addr.slice(-4);
}

function fmtAmount(wei) {
  // Display-only, assumes 18 decimals (true for USDT and every tokenized
  // stock this project touches - see docs/research/verified-facts.md).
  return Number(ethers.formatUnits(wei, 18)).toLocaleString(undefined, { maximumFractionDigits: 6 });
}

function fmtTime(unixSeconds) {
  if (unixSeconds === 0n) return "never";
  return new Date(Number(unixSeconds) * 1000).toISOString().replace("T", " ").slice(0, 19) + " UTC";
}

async function load() {
  const rpcUrl = $("rpc").value.trim();
  const contractAddress = $("contract").value.trim();
  setError("");

  if (!rpcUrl || !contractAddress) {
    setError("Both RPC URL and contract address are required.");
    return;
  }

  $("connect").disabled = true;
  try {
    const provider = new ethers.JsonRpcProvider(rpcUrl);
    const covenant = new ethers.Contract(contractAddress, ABI, provider);

    const [mandate, tradesUsedToday, stalenessBound, decisionTtl, agent, latestBlock] = await Promise.all([
      covenant.mandate(),
      covenant.tradesUsedToday(),
      covenant.stalenessBound(),
      covenant.decisionTtl(),
      covenant.agent(),
      provider.getBlockNumber(),
    ]);

    renderMandate(mandate, tradesUsedToday, stalenessBound, decisionTtl, agent);

    // fetchDecisionEvents (lib.mjs) races eth_getLogs against a timeout:
    // against a forked RPC, a fromBlock before the fork point hangs forever
    // with no error (friction-log.md B16).
    const fromBlock = resolveFromBlock($("fromBlock").value.trim(), latestBlock);
    const events = await fetchDecisionEvents(covenant, { fromBlock });
    renderDecisions(joinDecisions(events).slice(-MAX_DECISIONS).reverse());
  } catch (err) {
    console.error(err);
    setError(err?.message ?? String(err));
  } finally {
    $("connect").disabled = false;
  }
}

function renderMandate(mandate, tradesUsedToday, stalenessBound, decisionTtl, agent) {
  const el = $("mandate");
  el.classList.remove("empty");
  const [active, maxNotionalPerTradeUsd, maxTradesPerDay, expiry] = mandate;
  el.innerHTML = `
    <div class="stat"><div class="label">Active</div><div class="value">${active ? "yes" : "no"}</div></div>
    <div class="stat"><div class="label">Max per trade</div><div class="value">$${fmtAmount(maxNotionalPerTradeUsd)}</div></div>
    <div class="stat"><div class="label">Trades today</div><div class="value">${tradesUsedToday} / ${maxTradesPerDay}</div></div>
    <div class="stat"><div class="label">Expires</div><div class="value">${fmtTime(expiry)}</div></div>
    <div class="stat"><div class="label">Oracle staleness bound</div><div class="value">${stalenessBound}s</div></div>
    <div class="stat"><div class="label">Decision valid for</div><div class="value">${decisionTtl}s</div></div>
    <div class="stat"><div class="label">Agent</div><div class="value addr" title="${agent}">${fmtAddr(agent)}</div></div>
  `;
}

// "Boss battles" (GAMIFICATION-PLAN-2026-09-25.md item 1). The raw reason
// string is always still there, in the title attribute - the name/icon is
// decoration over it, never a replacement for the technical value.
function reasonOrModeCell(c, d) {
  if (c && !c.allowed) {
    const boss = bossFor(c.reason);
    if (!boss) return c.reason;
    const flagshipClass = boss.flagship ? " boss-flagship" : "";
    return `<span class="boss${flagshipClass}" title="${c.reason}">${boss.icon} ${boss.name}</span>`;
  }
  return d.settle ? d.settle.executionMode : "";
}

function statusBadge(d) {
  if (!d.commit) return `<span class="badge">SETTLED</span>`;
  if (!d.commit.allowed) return `<span class="badge deny">DENIED</span>`;
  if (d.cancelled) return `<span class="badge">CANCELLED</span>`;
  if (d.settle) return `<span class="badge allow">${d.settle.belowMin ? "SETTLED, BELOW MIN" : "SETTLED"}</span>`;
  return `<span class="badge allow">ALLOWED</span>`;
}

function renderDecisions(decisions) {
  const el = $("attestations");
  if (decisions.length === 0) {
    el.classList.add("empty");
    el.textContent = "No decisions found in the scanned block range.";
    return;
  }
  el.classList.remove("empty");

  const rows = decisions.map((d) => {
    const c = d.commit;
    // Plain-English feed: stock names and USD, not a hex reason index and a
    // truncated address - the technical row underneath still has the raw
    // fields for anyone who wants them.
    const fmtWei = (wei) => ethers.formatUnits(wei, 18);
    const plain = describeDecision(d, fmtWei);
    // Guarded vs. Unguarded Twin: only real denials get a counterfactual row.
    const twin = guardedVsUnguarded(d, fmtWei);
    const twinRow = twin ? `<tr class="plain-row twin-row"><td colspan="9">${twin}</td></tr>` : "";
    return `
      <tr>
        <td>#${d.id}</td>
        <td>${c ? c.blockNumber : "-"}</td>
        <td>${c ? c.side : "-"}</td>
        <td class="addr" title="${c ? c.token : ""}">${c ? fmtAddr(c.token) : "-"}</td>
        <td>${c ? fmtAmount(c.amountIn) : "-"}</td>
        <td>${d.settle ? fmtAmount(d.settle.amountOut) : "-"}</td>
        <td>${statusBadge(d)}</td>
        <td>${reasonOrModeCell(c, d)}</td>
        <td><span title="${c ? c.txHash : ""}">${c ? fmtAddr(c.txHash) : "-"}</span></td>
      </tr>
      <tr class="plain-row"><td colspan="9">${plain}</td></tr>
      ${twinRow}`;
  }).join("");

  el.innerHTML = `
    <table>
      <thead>
        <tr><th>Decision</th><th>Block</th><th>Side</th><th>Token</th><th>Amount in</th><th>Filled</th><th>Status</th><th>Reason / mode</th><th>Commit tx</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

$("connect").addEventListener("click", load);

const params = readUrlParams();
if (params.rpc) $("rpc").value = params.rpc;
if (params.contract) $("contract").value = params.contract;
if (params.fromBlock) $("fromBlock").value = params.fromBlock;
if (params.rpc && params.contract) load();
</script>
</body>
</html>
