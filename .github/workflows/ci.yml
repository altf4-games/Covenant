name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    # A run that hangs (a fork or public RPC that stops answering, seen once on a
    # runner) would otherwise hold the job for GitHub's six-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # setup-node's Node 22 ships npm 10.9.8; both lockfiles were written
      # by npm 12. `npm ci` requires an exact match to the lockfile, and
      # npm 10 read this repo's own lockfile as missing several nested
      # optional-peer entries (@noble/hashes@2.4.0) that npm 12 resolves -
      # a real, reproduced CI failure (run 36254087956), not a hypothetical
      # one. Pinning npm here instead of trying to regenerate the lockfile
      # under an older npm, since the same drift would just reappear the
      # next time either lockfile is regenerated locally.
      - run: npm install -g npm@12.0.2
      - run: npm ci
      # Types for everything the frontend build doesn't cover: scripts, tests,
      # the MCP server. tsx and Hardhat strip types without checking them.
      - run: npm run typecheck
      # The live/fork tests deploy to a real forked BSC mainnet and read
      # real chain state over public RPCs (no private key needed - nothing
      # here spends real gas). They can occasionally be slow or flaky under
      # a free-tier RPC's rate limit; the suite's own failover logic
      # (cli.mjs's jsonRpcWithFailover) is what those tests exist to prove
      # works, not something CI needs to work around.
      #
      # oracle-updater.live.ts cross-checks against Binance's authenticated
      # Web3 API (red-team H10) and fails closed without real credentials -
      # add WEB3_API_KEY / WEB3_API_SECRET as repo secrets (Settings ->
      # Secrets and variables -> Actions) or this one test fails in CI even
      # though everything else passes with no secrets at all.
      - run: npm test
        env:
          WEB3_API_KEY: ${{ secrets.WEB3_API_KEY }}
          WEB3_API_SECRET: ${{ secrets.WEB3_API_SECRET }}

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g npm@12.0.2
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
